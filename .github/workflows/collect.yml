name: stock-collect

# 台灣時間 18:05、20:05、22:05 各跑一次（各來源更新時間不同，沒更新完就下一輪再補）
on:
  schedule:
    - cron: '5 10 * * 1-5'
    - cron: '5 12 * * 1-5'
    - cron: '5 14 * * 1-5'
  workflow_dispatch:
    inputs:
      backfill:
        description: '回補最近幾個交易日的價量（0 = 不回補）'
        default: '0'
      date:
        description: '指定日期 YYYY-MM-DD（留空 = 最近一個交易日）'
        default: ''

permissions:
  contents: write

concurrency:
  group: stock-collect
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安裝套件
        run: pip install requests

      - name: 收集資料
        env:
          MAIL_URL: ${{ secrets.MAIL_URL }}
          MAIL_TOKEN: ${{ secrets.MAIL_TOKEN }}
          LAST_RUN: ${{ github.event.schedule == '5 14 * * 1-5' && '1' || '0' }}
          BACKFILL: ${{ github.event.inputs.backfill }}
          TARGET_DATE: ${{ github.event.inputs.date }}
        run: python collect.py --backfill "${BACKFILL:-0}" ${TARGET_DATE:+--date "$TARGET_DATE"}

      - name: 存回資料
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "stock data"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "存回失敗（已重試 3 次）"
          exit 1
